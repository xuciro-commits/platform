syntax = "proto3";

package platform.kernel.v1alpha1;

enum WorkState {
  WORK_STATE_UNSPECIFIED = 0;
  WORK_STATE_RUNNING = 1;
  WORK_STATE_COMPLETED = 2;
  WORK_STATE_FAILED = 3;
  WORK_STATE_CANCELLED = 4;
}

message Work {
  string work_id = 1;
  string owner_id = 2;
  uint32 generation = 3;
  WorkState state = 4;
  uint32 progress = 5;
  string checkpoint = 6;
}
