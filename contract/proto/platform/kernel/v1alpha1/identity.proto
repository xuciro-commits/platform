syntax = "proto3";

package platform.kernel.v1alpha1;

message EntityRef {
  string type = 1;
  string id = 2;
}

enum RedirectKind {
  REDIRECT_KIND_UNSPECIFIED = 0;
  REDIRECT_KIND_MERGE = 1;
  REDIRECT_KIND_SPLIT = 2;
}

message Redirect {
  EntityRef from = 1;
  repeated EntityRef to = 2;
  RedirectKind kind = 3;
}

message Candidates {
  repeated EntityRef refs = 1;
}

message Resolution {
  oneof outcome {
    EntityRef resolved = 1;
    Candidates ambiguous = 2;
  }
}
