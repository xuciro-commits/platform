syntax = "proto3";

package platform.kernel.v1alpha1;

enum AuthorityKind {
  AUTHORITY_KIND_UNSPECIFIED = 0;
  AUTHORITY_KIND_DEVICE = 1;
  AUTHORITY_KIND_TENANT_SERVER = 2;
  AUTHORITY_KIND_EXTERNAL = 3;
}

message AuthorityDeclaration {
  string tenant_id = 1;
  string data_class = 2;
  AuthorityKind kind = 3;
  string authority_id = 4;
  uint32 epoch = 5;
}

enum SubmissionState {
  SUBMISSION_STATE_UNSPECIFIED = 0;
  SUBMISSION_STATE_PENDING = 1;
  SUBMISSION_STATE_SENDING = 2;
  SUBMISSION_STATE_CONFIRMED = 3;
  SUBMISSION_STATE_CONFLICT = 4;
  SUBMISSION_STATE_REJECTED = 5;
  SUBMISSION_STATE_UNKNOWN = 6;
}
