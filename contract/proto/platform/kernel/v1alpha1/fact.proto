syntax = "proto3";

package platform.kernel.v1alpha1;

import "google/protobuf/timestamp.proto";
import "platform/kernel/v1alpha1/change.proto";
import "platform/kernel/v1alpha1/identity.proto";

enum FactKind {
  FACT_KIND_UNSPECIFIED = 0;
  FACT_KIND_OBSERVATION = 1;
  FACT_KIND_CLAIM = 2;
  FACT_KIND_DERIVED = 3;
}

message Provenance {
  oneof source {
    string principal_id = 1;
    string connector_id = 2;
  }
  google.protobuf.Timestamp source_time = 3;
  double confidence = 4;
}

message Fact {
  string tenant_id = 1;
  FactKind kind = 2;
  EntityRef subject = 3;
  string attribute = 4;
  SchemaRef schema = 5;
  Provenance provenance = 6;
  repeated string derived_from = 7;
  string idempotency_key = 8;
  bytes payload = 9;
}

message FactRecord {
  string fact_id = 1;
  Fact fact = 2;
  google.protobuf.Timestamp recorded_time = 3;
}
