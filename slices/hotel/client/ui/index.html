<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hotel Desk</title>
<style>
  :root { --fg: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7; --bg: #fbfbfd; --accent: #0a64d8; --bad: #c9302c; --warn: #b26a00; --ok: #1f7a3a; }
  @media (prefers-color-scheme: dark) { :root { --fg: #f5f5f7; --muted: #a1a1a6; --line: #3a3a3c; --bg: #1c1c1e; --accent: #4c9bff; --bad: #ff6b61; --warn: #ffb340; --ok: #4cd680; } }
  body { font: 13px -apple-system, system-ui, sans-serif; color: var(--fg); background: var(--bg); margin: 0; padding: 16px 20px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 22px 0 8px; }
  form, .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input, select, button { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; }
  button { cursor: pointer; } button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  table { width: 100%; border-collapse: collapse; } td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }
  .state { font-weight: 600; } .CONFIRMED { color: var(--ok); } .CONFLICT, .REJECTED { color: var(--bad); } .UNKNOWN, .PENDING, .SENDING { color: var(--warn); }
  .muted { color: var(--muted); } #status { margin-left: auto; }
</style>
</head>
<body>
<form id="login" class="bar">
  <input name="server" value="http://127.0.0.1:8480" size="26" aria-label="Server">
  <select name="token" aria-label="Staff">
    <option value="desk-a">Front desk · hotel-a</option>
    <option value="manager-a">Manager · hotel-a</option>
    <option value="desk-b">Front desk · hotel-b</option>
  </select>
  <button>Sign in</button>
  <span id="status" class="muted">Signed out</span>
</form>

<h2>New reservation</h2>
<form id="create">
  <select name="roomType"><option>standard</option><option>suite</option></select>
  <input name="checkIn" type="date" required> <input name="checkOut" type="date" required>
  <input name="guest" placeholder="Guest name" required>
  <button>Save draft</button>
</form>

<h2>Outbox <button id="send" class="primary">Send</button></h2>
<table><thead><tr><th>Decision</th><th>Reservation</th><th>Details</th><th>State</th><th>Answer</th><th></th></tr></thead><tbody id="outbox"></tbody></table>

<h2>Reservations (server)</h2>
<table><thead><tr><th>Reservation</th><th>Guest</th><th>Room</th><th>Stay</th><th>Version</th><th></th></tr></thead><tbody id="reservations"></tbody></table>

<script>
const { invoke } = window.__TAURI__.core;
const $ = (id) => document.getElementById(id);
const text = (v) => String(v ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const short = (id) => text(id).slice(0, 12);
const fail = (e) => alert(e);

async function refresh() {
  const s = await invoke('snapshot');
  $('status').textContent = s.principal ? `${s.principal} @ ${s.tenant} · ${s.online ? 'online' : 'offline'}` : 'Signed out';
  $('outbox').innerHTML = s.outbox.slice().reverse().map((e) => {
    const state = e.state.replace('SUBMISSION_STATE_', '');
    const p = e.payload || {};
    const details = p.roomType ? `${text(p.roomType)} ${text(p.checkIn)} → ${text(p.checkOut)} ${text(p.guest ?? '')}` : `version ${text(p.expectedVersion)}`;
    const revise = ['CONFLICT', 'REJECTED'].includes(state) && p.roomType
      ? `<button data-revise="${text(e.key)}">Revise dates</button>` : '';
    return `<tr><td>${text(e.schema.replace('hotel.reservation.', ''))}</td><td>${short(e.reservation)}</td><td>${details}</td>
      <td class="state ${state}">${state}</td><td class="muted">${short(e.outcome)}</td><td>${revise}</td></tr>`;
  }).join('');
  $('reservations').innerHTML = (s.reservations || []).map((r) => `<tr><td>${short(r.id)}</td><td>${text(r.guest)}</td>
      <td>${text(r.roomType)}</td><td>${text(r.checkIn)} → ${text(r.checkOut)}</td><td>${r.version}${r.canceled ? ' · canceled' : ''}</td>
      <td>${r.canceled ? '' : `<button data-modify="${text(r.id)}" data-version="${r.version}" data-room="${text(r.roomType)}">Extend 1 night</button>
      <button data-cancel="${text(r.id)}" data-version="${r.version}">Cancel</button>`}</td></tr>`).join('')
    || `<tr><td colspan="6" class="muted">${s.online ? 'None' : 'Server unreachable; drafts stay in the outbox'}</td></tr>`;
  window.reservations = s.reservations || [];
}

const nextDay = (d) => { const t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + 1); return t.toISOString().slice(0, 10); };

$('login').onsubmit = (ev) => { ev.preventDefault(); const f = new FormData(ev.target);
  invoke('login', { server: f.get('server'), token: f.get('token') }).then(refresh, fail); };
$('create').onsubmit = (ev) => { ev.preventDefault(); const f = Object.fromEntries(new FormData(ev.target));
  invoke('draft', { schema: 'create', reservationId: null, payload: f }).then(refresh, fail); };
$('send').onclick = () => invoke('send').then(refresh, fail);
document.body.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.cancel) invoke('draft', { schema: 'cancel', reservationId: b.dataset.cancel,
    payload: { expectedVersion: Number(b.dataset.version) } }).then(refresh, fail);
  if (b.dataset.modify) { const r = window.reservations.find((x) => x.id === b.dataset.modify);
    invoke('draft', { schema: 'modify', reservationId: r.id, payload: { roomType: r.roomType, checkIn: r.checkIn,
      checkOut: nextDay(r.checkOut), expectedVersion: r.version } }).then(refresh, fail); }
  if (b.dataset.revise) { const checkIn = prompt('New check-in (YYYY-MM-DD)'); const checkOut = checkIn && prompt('New check-out (YYYY-MM-DD)');
    if (!checkOut) return; const row = b.closest('tr');
    invoke('snapshot').then((s) => { const e = s.outbox.find((x) => x.key === b.dataset.revise);
      return invoke('revise', { idempotencyKey: e.key, payload: { ...e.payload, checkIn, checkOut } }); }).then(refresh, fail); }
});
refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
