# air (go install github.com/air-verse/air@latest) rebuilds and restarts the
# solution host when Go sources change. `make dev SOLUTION=hospitality`
# exports SOLUTION for build.sh and passes the solution and port after `--`
# to run.sh, which starts the binary with the flags of the containers'
# infrastructure.
root = "."
tmp_dir = ".build/dev"

[build]
cmd = "deploy/dev/build.sh"
bin = "deploy/dev/run.sh"
include_dir = ["capabilities/server", "apps", "protocols", "solutions", "contract/go"]
include_ext = ["go", "json"]
exclude_dir = ["web", "node_modules", "capabilities/server/vendor", ".build", "docs", "deploy", "apps/pms/client", "contract/lean", "contract/proto"]
exclude_regex = ["_test\\.go$"]
exclude_unchanged = true
delay = 500
kill_delay = "2s"
send_interrupt = true
stop_on_error = true

[log]
main_only = true
time = false

[misc]
clean_on_exit = false
