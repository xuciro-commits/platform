root = "."
tmp_dir = ".build/dev"

[build]
cmd = "deploy/dev/build.sh"
entrypoint = ["deploy/dev/run.sh"]
include_dir = ["capabilities/server", "contract/go"]
include_ext = ["go", "json"]
exclude_dir = ["web", "node_modules", "capabilities/server/vendor", ".build", "deploy", "contract/proto"]
exclude_unchanged = true
delay = 500
kill_delay = "2s"
send_interrupt = true
stop_on_error = true

[log]
main_only = true
time = false

[misc]
clean_on_exit = false
