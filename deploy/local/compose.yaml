# The platform host's two deployments on their production path, locally (#87, #92):
# manufacturing-server (the manufacturing solution: the MES and the ERP, ADR-0024)
# and hospitality-server (the hospitality solution: CRM, PMS, HCM, CSM). PostgreSQL
# keeps the journal, Rauthy issues identities, each host replays the journal on start. Each host serves the workspace (ADR-0018), built first:
# `pnpm --dir web/apps/workspace build && docker compose -f deploy/local/compose.yaml up -d --build`
# Ports are parameters so rehearse.sh can run a second, disposable project.
name: platform

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform-local-only
    ports: ["127.0.0.1:${PG_PORT:-5433}:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "platform", "-d", "platform"]
      interval: 2s
      retries: 30

  # File bytes (ADR-0028): RustFS, an S3-compatible object store; the journal keeps
  # only each file's hash. Its console is on FILES_CONSOLE_PORT (platform / platform-files-local-only).
  rustfs:
    image: rustfs/rustfs:latest@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff # pinned; RustFS publishes often
    environment:
      RUSTFS_ACCESS_KEY: platform
      RUSTFS_SECRET_KEY: platform-files-local-only
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    ports: ["127.0.0.1:${FILES_PORT:-9000}:9000", "127.0.0.1:${FILES_CONSOLE_PORT:-9001}:9001"]
    volumes: [files:/data]

  rauthy:
    image: ghcr.io/sebadob/rauthy:0.36.2
    command: ["serve"]
    environment:
      PUB_URL: localhost:${IDP_PORT:-8480}
      RP_ORIGIN: http://localhost:${IDP_PORT:-8480}
    ports: ["127.0.0.1:${IDP_PORT:-8480}:8080"]
    volumes:
      - ./rauthy/config.toml:/app/config.toml:ro
      - ./rauthy/bootstrap:/app/bootstrap:ro
      - rauthy:/app/data

  manufacturing-server:
    build: { context: ../.., dockerfile: solutions/manufacturing/Dockerfile }
    command:
      - -addr=0.0.0.0:8490
      - -database=postgres://platform:platform-local-only@postgres:5432/platform
      - -oidc-issuer=http://localhost:${IDP_PORT:-8480}/auth/v1/
      - -oidc-keys=http://rauthy:8080/auth/v1/oidc/certs
      - -directory=/etc/manufacturing/directory.json
      - -web=/web
      - -project
      - -files=http://rustfs:9000/platform
    ports: ["127.0.0.1:${MANUFACTURING_PORT:-8490}:8490"]
    volumes: [./manufacturing/directory.json:/etc/manufacturing/directory.json:ro]
    environment: { PLATFORM_SECRET_SINK: sinkLocalOnly0000000000000000000000000000000000000000000000000000, PLATFORM_SECRET_OPENROUTER: "${OPENROUTER_API_KEY:-}",
      PLATFORM_S3_ACCESS_KEY: platform, PLATFORM_S3_SECRET_KEY: platform-files-local-only }
    depends_on:
      postgres: { condition: service_healthy }
      rauthy: { condition: service_started }
      rustfs: { condition: service_started }
    restart: on-failure

  hospitality-server:
    build: { context: ../.., dockerfile: solutions/hospitality/Dockerfile }
    command:
      - -addr=0.0.0.0:8495
      - -database=postgres://platform:platform-local-only@postgres:5432/platform
      - -oidc-issuer=http://localhost:${IDP_PORT:-8480}/auth/v1/
      - -oidc-keys=http://rauthy:8080/auth/v1/oidc/certs
      - -directory=/etc/hospitality/directory.json
      - -web=/web
      - -project
      - -files=http://rustfs:9000/platform
    ports: ["127.0.0.1:${HOSPITALITY_PORT:-8495}:8495"]
    volumes: [./hospitality/directory.json:/etc/hospitality/directory.json:ro]
    # Webhook signing secrets, referenced by name from endpoints (ADR-0014 D5); local-only.
    environment: { PLATFORM_SECRET_SINK: sinkLocalOnly0000000000000000000000000000000000000000000000000000, PLATFORM_SECRET_OPENROUTER: "${OPENROUTER_API_KEY:-}",
      PLATFORM_S3_ACCESS_KEY: platform, PLATFORM_S3_SECRET_KEY: platform-files-local-only }
    depends_on:
      postgres: { condition: service_healthy }
      rauthy: { condition: service_started }
      rustfs: { condition: service_started }
    restart: on-failure

  # A webhook receiver, mail server, model server and supplier's agent for local endpoints and the rehearsal (ADR-0014).
  webhook-sink:
    build: { context: ../.., dockerfile: capabilities/server/cmd/webhook-sink/Dockerfile }
    environment: { WEBHOOK_SECRET: sinkLocalOnly0000000000000000000000000000000000000000000000000000 }
    ports: ["127.0.0.1:${SINK_PORT:-8497}:8080"]

volumes:
  pgdata:
  rauthy:
  files:
