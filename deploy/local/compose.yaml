# One Platform product entry, including OIDC at /auth.
# Generate private local configuration with make bootstrap before starting.
name: platform

services:
  postgres:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.postgres
    image: platform-postgres:18-vector
    environment:
      POSTGRES_DB: ${PLATFORM_DATABASE_NAME:?run make bootstrap}
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make bootstrap}
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "platform", "-d", "${PLATFORM_DATABASE_NAME}"]
      interval: 2s
      retries: 30

  # File bytes remain on the private Compose network.
  rustfs:
    image: rustfs/rustfs:latest@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff # pinned; RustFS publishes often
    environment:
      RUSTFS_ACCESS_KEY: ${PLATFORM_S3_ACCESS_KEY:?run make bootstrap}
      RUSTFS_SECRET_KEY: ${PLATFORM_S3_SECRET_KEY:?run make bootstrap}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    volumes: [files:/data]

  rauthy:
    image: ghcr.io/sebadob/rauthy:0.36.2
    command: ["serve"]
    # Read private host-generated bootstrap files; only this local IdP runs as root.
    user: "0:0"
    environment:
      PUB_URL: localhost:${PLATFORM_PORT:-8495}
      RP_ORIGIN: ${PLATFORM_PUBLIC_URL:?run make bootstrap}
    volumes:
      - ${PLATFORM_LOCAL_ROOT}/rauthy/config.toml:/app/config.toml:ro
      - ${PLATFORM_LOCAL_ROOT}/rauthy/bootstrap:/app/bootstrap:ro
      - rauthy:/app/data

  platform-server:
    user: "${PLATFORM_RUN_UID}:${PLATFORM_RUN_GID}"
    build:
      context: ../..
      dockerfile: capabilities/server/cmd/platform-server/Dockerfile
      args: { PLATFORM_REVISION: "${PLATFORM_REVISION:-}" }
    command:
      - -addr=0.0.0.0:8495
      - -database=postgres://platform:${POSTGRES_PASSWORD}@postgres:5432/${PLATFORM_DATABASE_NAME}
      - -oidc-issuer=${PLATFORM_PUBLIC_URL}/auth/v1/
      - -oidc-proxy=http://rauthy:8080
      - -oidc-keys=http://rauthy:8080/auth/v1/oidc/certs
      - -tenants=/etc/platform/tenants.json
      - -templates=/etc/templates
      - -host-admins=${PLATFORM_HOST_ADMINS}
      - -web=/web
      - -project
      - -files=http://rustfs:9000/platform
    ports: ["127.0.0.1:${PLATFORM_PORT:-8495}:8495"]
    volumes: ["${PLATFORM_TENANTS_FILE}:/etc/platform/tenants.json", ../templates:/etc/templates:ro, ../packages:/etc/packages:ro, compute-sockets:/run/platform-compute]
    environment:
      PLATFORM_CREDENTIAL_KEY: ${PLATFORM_CREDENTIAL_KEY:?run make bootstrap}
      PLATFORM_PERSONAL_TOKEN_KEY: ${PLATFORM_PERSONAL_TOKEN_KEY:?run make bootstrap}
      PLATFORM_S3_ACCESS_KEY: ${PLATFORM_S3_ACCESS_KEY}
      PLATFORM_S3_SECRET_KEY: ${PLATFORM_S3_SECRET_KEY}
      PLATFORM_PACKAGES_DIR: /etc/packages
      PLATFORM_WASM_WORKER_SOCKET: /run/platform-compute/worker.sock
      PLATFORM_CODE_BUILDER_SOCKET: /run/platform-compute/builder.sock
    depends_on:
      postgres: { condition: service_healthy }
      rauthy: { condition: service_started }
      rustfs: { condition: service_started }
      wasm-worker: { condition: service_healthy }
      code-builder: { condition: service_healthy }
    restart: on-failure

  # Stateless compute execution and fixed-profile build drivers.
  # Compiler images are pulled once by the owner; every tenant build is offline.
  wasm-worker:
    build: { context: ../.., dockerfile: capabilities/server/cmd/compute/Dockerfile, target: worker }
    command: ["-socket=/run/platform-compute/worker.sock", "-concurrency=4"]

    healthcheck:
      test: ["CMD", "wasm-worker", "-check", "-socket=/run/platform-compute/worker.sock"]
      interval: 2s
      retries: 15
    volumes: [compute-sockets:/run/platform-compute]
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    stop_grace_period: 15s
    restart: on-failure

  code-builder:
    build: { context: ../.., dockerfile: capabilities/server/cmd/compute/Dockerfile, target: builder }
    command: ["-socket=/run/platform-compute/builder.sock"]

    healthcheck:
      test: ["CMD", "code-builder", "-check", "-socket=/run/platform-compute/builder.sock"]
      interval: 2s
      retries: 15
    volumes: [compute-sockets:/run/platform-compute, /var/run/docker.sock:/var/run/docker.sock]
    environment:
      PLATFORM_GO_WASM_IMAGE: golang@sha256:8a5910f31396cd4d89662f56c68b3ae31d374308270a1c3bd96672ee5ed43414
      PLATFORM_TINYGO_WASM_IMAGE: ghcr.io/tinygo-org/tinygo@sha256:52907162ca3ba807c3c0914e07daffc1fe0c50ce91445ec43a0428337dc1b901
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    stop_grace_period: 15s
    restart: on-failure


volumes:
  pgdata:
    name: ${PLATFORM_DATA_NAMESPACE:?run make bootstrap}_pgdata
  rauthy:
    name: ${PLATFORM_DATA_NAMESPACE:?run make bootstrap}_rauthy
  files:
    name: ${PLATFORM_DATA_NAMESPACE:?run make bootstrap}_files
  compute-sockets:
    name: ${PLATFORM_DATA_NAMESPACE:?run make bootstrap}_compute-sockets
