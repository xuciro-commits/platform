# The platform host's two deployments on their production path, locally (#87, #92):
# manufacturing-server (the manufacturing solution: the MES and the ERP, ADR-0024)
# and hospitality-server (the hospitality solution: CRM, PMS, HCM, CSM). PostgreSQL
# keeps the journal, Rauthy issues identities, each host replays the journal on start. Each host serves the workspace (ADR-0018), built first:
# `pnpm --dir web/apps/workspace build && docker compose -f deploy/local/compose.yaml up -d --build`
# Ports are parameters so rehearse.sh can run a second, disposable project.
name: platform

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform-local-only
    ports: ["127.0.0.1:${PG_PORT:-5433}:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "platform", "-d", "platform"]
      interval: 2s
      retries: 30

  # File bytes (ADR-0028): RustFS, an S3-compatible object store; the journal keeps
  # only each file's hash. Its console is on FILES_CONSOLE_PORT (platform / platform-files-local-only).
  rustfs:
    image: rustfs/rustfs:latest@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff # pinned; RustFS publishes often
    environment:
      RUSTFS_ACCESS_KEY: platform
      RUSTFS_SECRET_KEY: platform-files-local-only
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    ports: ["127.0.0.1:${FILES_PORT:-9000}:9000", "127.0.0.1:${FILES_CONSOLE_PORT:-9001}:9001"]
    volumes: [files:/data]

  rauthy:
    image: ghcr.io/sebadob/rauthy:0.36.2
    command: ["serve"]
    environment:
      PUB_URL: localhost:${IDP_PORT:-8480}
      RP_ORIGIN: http://localhost:${IDP_PORT:-8480}
    ports: ["127.0.0.1:${IDP_PORT:-8480}:8080"]
    volumes:
      - ./rauthy/config.toml:/app/config.toml:ro
      - ./rauthy/bootstrap:/app/bootstrap:ro
      - rauthy:/app/data

  manufacturing-server:
    # Permit the non-root host to append tenants.json through its owning group.
    group_add: ["${TENANTS_GID:-20}"]
    build:
      context: ../..
      dockerfile: solutions/manufacturing/Dockerfile
      args: { PLATFORM_REVISION: "${PLATFORM_REVISION:-}" }
    command:
      - -addr=0.0.0.0:8490
      - -database=postgres://platform:platform-local-only@postgres:5432/platform
      - -oidc-issuer=http://localhost:${IDP_PORT:-8480}/auth/v1/
      - -oidc-keys=http://rauthy:8080/auth/v1/oidc/certs
      - -tenants=/etc/manufacturing/tenants.json
      - -templates=/etc/templates
      - -host-admins=user:sup@plant.test
      - -web=/web
      - -project
      - -files=http://rustfs:9000/platform
    ports: ["127.0.0.1:${MANUFACTURING_PORT:-8490}:8490"]
    volumes: [./manufacturing/tenants.json:/etc/manufacturing/tenants.json, ../templates:/etc/templates:ro, compute-sockets:/run/platform-compute]
    environment: { PLATFORM_PERSONAL_TOKEN_KEY: "${PLATFORM_PERSONAL_TOKEN_KEY:-}", PLATFORM_SECRET_SINK: sinkLocalOnly0000000000000000000000000000000000000000000000000000, PLATFORM_SECRET_OPENROUTER: "${OPENROUTER_API_KEY:-}",
      PLATFORM_S3_ACCESS_KEY: platform, PLATFORM_S3_SECRET_KEY: platform-files-local-only,
      PLATFORM_WASM_WORKER_SOCKET: /run/platform-compute/worker.sock, PLATFORM_CODE_BUILDER_SOCKET: /run/platform-compute/builder.sock }
    depends_on:
      postgres: { condition: service_healthy }
      rauthy: { condition: service_started }
      rustfs: { condition: service_started }
      wasm-worker: { condition: service_healthy }
      code-builder: { condition: service_healthy }
    restart: on-failure

  hospitality-server:
    group_add: ["${TENANTS_GID:-20}"]
    build:
      context: ../..
      dockerfile: solutions/hospitality/Dockerfile
      args: { PLATFORM_REVISION: "${PLATFORM_REVISION:-}" }
    command:
      - -addr=0.0.0.0:8495
      - -database=postgres://platform:platform-local-only@postgres:5432/platform
      - -oidc-issuer=http://localhost:${IDP_PORT:-8480}/auth/v1/
      - -oidc-keys=http://rauthy:8080/auth/v1/oidc/certs
      - -tenants=/etc/hospitality/tenants.json
      - -templates=/etc/templates
      - -host-admins=user:manager@hotel.test
      - -web=/web
      - -project
      - -files=http://rustfs:9000/platform
    ports: ["127.0.0.1:${HOSPITALITY_PORT:-8495}:8495"]
    volumes: [./hospitality/tenants.json:/etc/hospitality/tenants.json, ../templates:/etc/templates:ro, compute-sockets:/run/platform-compute]
    # Webhook signing secrets, referenced by name from endpoints (ADR-0014 D5); local-only.
    environment: { PLATFORM_PERSONAL_TOKEN_KEY: "${PLATFORM_PERSONAL_TOKEN_KEY:-}", PLATFORM_SECRET_SINK: sinkLocalOnly0000000000000000000000000000000000000000000000000000, PLATFORM_SECRET_OPENROUTER: "${OPENROUTER_API_KEY:-}",
      PLATFORM_S3_ACCESS_KEY: platform, PLATFORM_S3_SECRET_KEY: platform-files-local-only,
      PLATFORM_WASM_WORKER_SOCKET: /run/platform-compute/worker.sock, PLATFORM_CODE_BUILDER_SOCKET: /run/platform-compute/builder.sock }
    depends_on:
      postgres: { condition: service_healthy }
      rauthy: { condition: service_started }
      rustfs: { condition: service_started }
      wasm-worker: { condition: service_healthy }
      code-builder: { condition: service_healthy }
    restart: on-failure

  # Stateless compute execution and fixed-profile build drivers (ADR-0044).
  # Compiler images are pulled once by the owner; every tenant build is offline.
  wasm-worker:
    build: { context: ../.., dockerfile: capabilities/server/cmd/compute/Dockerfile, target: worker }
    command: ["-socket=/run/platform-compute/worker.sock", "-concurrency=4"]

    healthcheck:
      test: ["CMD", "wasm-worker", "-check", "-socket=/run/platform-compute/worker.sock"]
      interval: 2s
      retries: 15
    volumes: [compute-sockets:/run/platform-compute]
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    stop_grace_period: 15s
    restart: on-failure

  code-builder:
    build: { context: ../.., dockerfile: capabilities/server/cmd/compute/Dockerfile, target: builder }
    command: ["-socket=/run/platform-compute/builder.sock"]

    healthcheck:
      test: ["CMD", "code-builder", "-check", "-socket=/run/platform-compute/builder.sock"]
      interval: 2s
      retries: 15
    volumes: [compute-sockets:/run/platform-compute, /var/run/docker.sock:/var/run/docker.sock]
    environment:
      PLATFORM_GO_WASM_IMAGE: golang@sha256:8a5910f31396cd4d89662f56c68b3ae31d374308270a1c3bd96672ee5ed43414
      PLATFORM_TINYGO_WASM_IMAGE: ghcr.io/tinygo-org/tinygo@sha256:52907162ca3ba807c3c0914e07daffc1fe0c50ce91445ec43a0428337dc1b901
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    stop_grace_period: 15s
    restart: on-failure

  # A webhook receiver, mail server, model server and supplier's agent for local endpoints and the rehearsal (ADR-0014).
  webhook-sink:
    build: { context: ../.., dockerfile: capabilities/server/cmd/webhook-sink/Dockerfile }
    environment: { WEBHOOK_SECRET: sinkLocalOnly0000000000000000000000000000000000000000000000000000 }
    ports: ["127.0.0.1:${SINK_PORT:-8497}:8080"]

volumes:
  pgdata:
    name: ${PLATFORM_DATA_NAMESPACE:-${COMPOSE_PROJECT_NAME}}_pgdata
  rauthy:
    name: ${PLATFORM_DATA_NAMESPACE:-${COMPOSE_PROJECT_NAME}}_rauthy
  files:
    name: ${PLATFORM_DATA_NAMESPACE:-${COMPOSE_PROJECT_NAME}}_files
  compute-sockets:
    name: ${PLATFORM_DATA_NAMESPACE:-${COMPOSE_PROJECT_NAME}}_compute-sockets
