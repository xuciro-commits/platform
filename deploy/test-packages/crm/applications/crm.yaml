name: crm
pages:
  - crm.lead
  - crm.deal
  - crm.organization
  - crm.contact
  - crm.task
  - crm.note
  - crm.product
  - crm.territory
title: CRM
groups:
  - title: Workspace
    pages:
      - crm.lead
      - crm.deal
      - crm.organization
      - crm.contact
      - crm.task
      - crm.note
  - title: Settings
    roles:
      - salesmanager
      - builder
    pages:
      - crm.product
      - crm.territory
dashboard:
  - title: Leads
    kind: metric
    object: crm.lead
  - title: Open deals
    kind: metric
    object: crm.deal
    domain:
      - - state
        - =
        - open
  - title: Won deals
    kind: metric
    object: crm.deal
    domain:
      - - state
        - =
        - won
  - title: Average deal value
    kind: metric
    object: crm.deal
    measure: avg:dealvalue
  - title: Sales funnel
    kind: funnel
    object: crm.deal
    domain:
      - - state
        - =
        - open
    group: status
  - title: Deal value by stage
    kind: bar
    object: crm.deal
    measure: sum:dealvalue
    group: status
  - title: Leads by source
    kind: share
    object: crm.lead
    group: source
  - title: Leads by status
    kind: share
    object: crm.lead
    group: status
  - title: New deals
    kind: line
    object: crm.deal
    group: created:month
resources:
  - app: build
    kind: flow
    name: build.leadresponded
  - app: build
    kind: flow
    name: build.leadresponse
  - app: build
    kind: flow
    name: build.leadbalance
