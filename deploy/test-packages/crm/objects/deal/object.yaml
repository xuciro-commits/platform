access:
  - create: true
    edit: true
    read: team
    role: salesrep
  - archive: true
    create: true
    edit: true
    read: all
    role: salesmanager
display: title
fields:
  - group: Commercial
    name: title
    required: true
    search: true
    title: Deal
    type: text
  - group: Commercial
    inverse: deals
    name: organization
    ref: crm.organization
    search: true
    title: Organization
    type: reference
  - group: Commercial
    name: contact
    ref: crm.contact
    title: Primary contact
    type: reference
  - group: Commercial
    name: lead
    ref: crm.lead
    title: Source lead
    type: reference
  - group: Commercial
    name: dealvalue
    title: Deal value
    type: money
    default: setting:currency
  - formulaExpr:
      agg:
        field:
          - amount
        source: lines
      kind: money
      op: sum
    group: Commercial
    name: total
    title: Products total
    type: money
  - group: Commercial
    name: expectedclose
    title: Expected close
    type: date
  - from:
      args:
        - args:
            - kind: reference
              op: ""
              ref: status
            - kind: set
              lit:
                element: reference
                value:
                  - won
                  - lost
              op: ""
          kind: boolean
          op: in
        - kind: date
          op: $today
        - kind: date
          op: ""
          ref: closeddate
      kind: date
      op: if
    group: Commercial
    name: closeddate
    title: Closed date
    type: date
    when: status=won,lost
  - group: Classification
    name: source
    ref: crm.source
    title: Source
    type: reference
  - group: Classification
    name: industry
    ref: crm.industry
    title: Industry
    type: reference
    from:
      op: path
      kind: reference
      args:
        - op: ""
          kind: reference
          ref: organization
      path:
        - industry
  - group: Classification
    name: territory
    ref: crm.territory
    title: Territory
    type: reference
    from:
      op: path
      kind: reference
      args:
        - op: ""
          kind: reference
          ref: organization
      path:
        - territory
  - group: Closure
    name: lostreason
    ref: crm.lostreason
    required: true
    title: Lost reason
    type: reference
    when: status=lost
  - group: Closure
    name: lostnotes
    title: Lost notes
    type: longtext
    when: status=lost
  - aside: true
    name: status
    ref: crm.dealstatus
    required: true
    title: Status
    type: reference
  - aside: true
    from:
      args:
        - args:
            - kind: reference
              op: ""
              ref: status
            - kind: reference
              lit:
                value: qualification
              op: ""
          kind: boolean
          op: =
        - kind: integer
          lit:
            value: 10
          op: ""
        - args:
            - args:
                - kind: reference
                  op: ""
                  ref: status
                - kind: reference
                  lit:
                    value: demomaking
                  op: ""
              kind: boolean
              op: =
            - kind: integer
              lit:
                value: 25
              op: ""
            - args:
                - args:
                    - kind: reference
                      op: ""
                      ref: status
                    - kind: reference
                      lit:
                        value: proposalquotation
                      op: ""
                  kind: boolean
                  op: =
                - kind: integer
                  lit:
                    value: 50
                  op: ""
                - args:
                    - args:
                        - kind: reference
                          op: ""
                          ref: status
                        - kind: reference
                          lit:
                            value: negotiation
                          op: ""
                      kind: boolean
                      op: =
                    - kind: integer
                      lit:
                        value: 70
                      op: ""
                    - args:
                        - args:
                            - kind: reference
                              op: ""
                              ref: status
                            - kind: reference
                              lit:
                                value: readytoclose
                              op: ""
                          kind: boolean
                          op: =
                        - kind: integer
                          lit:
                            value: 90
                          op: ""
                        - args:
                            - args:
                                - kind: reference
                                  op: ""
                                  ref: status
                                - kind: reference
                                  lit:
                                    value: won
                                  op: ""
                              kind: boolean
                              op: =
                            - kind: integer
                              lit:
                                value: 100
                              op: ""
                            - kind: integer
                              lit:
                                value: 0
                              op: ""
                          kind: integer
                          op: if
                      kind: integer
                      op: if
                  kind: integer
                  op: if
              kind: integer
              op: if
          kind: integer
          op: if
      kind: integer
      op: if
    name: probability
    title: Probability %
    type: integer
  - aside: true
    name: owner
    title: Deal owner
    type: member
    default: member
name: deal
namespace: crm
plural: Deals
reads:
  collections:
    lines:
      app: build
      object: crm.dealline
      policy: complete
      query: ""
      set: lines
      version: 0
scope:
  owner: owner
sets:
  - direction: inverse
    from: lines
    limit: 200
    name: lines
    object: crm.dealline
    order:
      - expr:
          kind: text
          op: ""
          ref: id
states:
  - name: open
    title: Open
    tone: info
    description: Active deal record.
  - name: won
    title: Won
    tone: success
    description: Deal closed as won.
  - name: lost
    title: Lost
    tone: danger
    description: Deal closed as lost.
title: Deal
type: crm.deal
view:
  columns:
    - title
    - organization
    - status
    - dealvalue
    - probability
    - owner
    - expectedclose
  filters: []
  group: none
  lanes: status
  layout: table
  search: ""
  sort: []
  version: 1
  dates: expectedclose
naming: CRM-DEAL-{year}-{n:5}
actions:
  - name: win
    title: Mark won
    description: Close this deal as won.
    from:
      - open
    transaction:
      subject: crm.deal
      steps:
        - name: deal
          kind: update
          target:
            type: crm.deal
            id: $subject
          changes:
            - field: state
              expr:
                op: ""
                kind: choice
                lit:
                  value: won
            - field: status
              expr:
                op: ""
                kind: reference
                lit:
                  value: won
  - name: lose
    title: Mark lost
    description: Close this deal as lost with a lost reason.
    from:
      - open
    inputs:
      - name: lostreason
        title: Lost reason
        type: reference
        ref: crm.lostreason
        required: true
      - name: lostnotes
        title: Lost notes
        type: longtext
    transaction:
      subject: crm.deal
      steps:
        - name: deal
          kind: update
          target:
            type: crm.deal
            id: $subject
          changes:
            - field: state
              expr:
                op: ""
                kind: choice
                lit:
                  value: lost
            - field: status
              expr:
                op: ""
                kind: reference
                lit:
                  value: lost
            - field: lostreason
              expr:
                op: ""
                kind: reference
                ref: input.lostreason
            - field: lostnotes
              expr:
                op: ""
                kind: text
                ref: input.lostnotes
  - name: reopen
    title: Reopen
    description: Reopen a closed deal back into qualification.
    from:
      - won
      - lost
    transaction:
      subject: crm.deal
      steps:
        - name: deal
          kind: update
          target:
            type: crm.deal
            id: $subject
          changes:
            - field: state
              expr:
                op: ""
                kind: choice
                lit:
                  value: open
            - field: status
              expr:
                op: ""
                kind: reference
                lit:
                  value: qualification
constraints:
  - name: open_status
    kind: expression
    fields:
      - status
    expr:
      op: or
      kind: boolean
      args:
        - op: and
          kind: boolean
          args:
            - op: '!='
              kind: boolean
              args:
                - op: ""
                  kind: choice
                  ref: state
                - op: ""
                  kind: choice
                  lit:
                    value: ""
            - op: '!='
              kind: boolean
              args:
                - op: ""
                  kind: choice
                  ref: state
                - op: ""
                  kind: choice
                  lit:
                    value: open
        - op: and
          kind: boolean
          args:
            - op: '!='
              kind: boolean
              args:
                - op: ""
                  kind: reference
                  ref: status
                - op: ""
                  kind: reference
                  lit:
                    value: won
            - op: '!='
              kind: boolean
              args:
                - op: ""
                  kind: reference
                  ref: status
                - op: ""
                  kind: reference
                  lit:
                    value: lost
    message: Closing a deal requires Mark won or Mark lost.
  - name: closed_status
    kind: expression
    fields:
      - status
    expr:
      op: or
      kind: boolean
      args:
        - op: =
          kind: boolean
          args:
            - op: ""
              kind: choice
              ref: state
            - op: ""
              kind: choice
              lit:
                value: ""
        - op: =
          kind: boolean
          args:
            - op: ""
              kind: choice
              ref: state
            - op: ""
              kind: choice
              lit:
                value: open
        - op: and
          kind: boolean
          args:
            - op: =
              kind: boolean
              args:
                - op: ""
                  kind: choice
                  ref: state
                - op: ""
                  kind: choice
                  lit:
                    value: won
            - op: =
              kind: boolean
              args:
                - op: ""
                  kind: reference
                  ref: status
                - op: ""
                  kind: reference
                  lit:
                    value: won
        - op: and
          kind: boolean
          args:
            - op: =
              kind: boolean
              args:
                - op: ""
                  kind: choice
                  ref: state
                - op: ""
                  kind: choice
                  lit:
                    value: lost
            - op: =
              kind: boolean
              args:
                - op: ""
                  kind: reference
                  ref: status
                - op: ""
                  kind: reference
                  lit:
                    value: lost
    message: A closed deal's status cannot be edited directly; reopen it first.
