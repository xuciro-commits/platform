action:
  capability: lead
  description: Create a lead.
  new: true
  payload:
    - description: Full name
      group: Contact
      name: fullname
      required: true
      type: string
    - description: Organization
      group: Contact
      name: organizationname
      type: string
    - description: Email
      group: Contact
      name: email
      type: string
    - description: Mobile no.
      group: Contact
      name: mobile
      type: string
    - description: Phone
      group: Contact
      name: phone
      type: string
    - description: Website
      group: Contact
      name: website
      type: string
    - description: LinkedIn
      group: Contact
      name: linkedin
      type: string
    - description: Job title
      group: Contact
      name: jobtitle
      type: string
    - description: Source
      group: Classification
      name: source
      type: string
    - description: Industry
      group: Classification
      name: industry
      type: string
    - description: Territory
      group: Classification
      name: territory
      type: string
    - choices:
        - 1-10
        - 11-50
        - 51-200
        - 201-500
        - 501-1000
        - 1000+
      description: Employees (1-10, 11-50, 51-200, 201-500, 501-1000, 1000+)
      group: Classification
      name: employees
      type: string
    - description: Annual revenue
      group: Classification
      name: annualrevenue
      type: money
    - description: Lost reason
      group: Closure
      name: lostreason
      type: string
    - description: Lost notes
      group: Closure
      name: lostnotes
      type: string
    - description: Status
      name: status
      required: true
      type: string
    - description: Lead owner
      name: owner
      type: string
      default: member
    - default: now+4h
      description: Respond by
      name: responseby
      type: datetime
    - choiceTitles:
        - due
        - fulfilled
        - failed
      choices:
        - due
        - fulfilled
        - failed
      default: due
      description: First response (due, fulfilled, failed)
      name: slastatus
      type: string
  schema: crm.lead.create
  schemaVersion:
    family: 5
    version: schema.sha256.3b25ecde7872a3da3bdcc1abd8986ee225e0d0de877a986f70f28f9290f88954
  target: crm.lead
  title: Create lead
roles:
  - builder
  - salesrep
  - salesmanager
schema: crm.lead.create
target: crm.lead
