action:
  capability: task
  description: Create a task.
  new: true
  payload:
    - description: Title
      group: Task
      name: title
      required: true
      type: string
    - description: Description
      group: Task
      name: description
      type: string
    - description: Lead
      group: Task
      name: lead
      type: string
    - description: Deal
      group: Task
      name: deal
      type: string
    - choices:
        - backlog
        - todo
        - inprogress
        - done
        - canceled
      description: Status (backlog, todo, inprogress, done, canceled)
      name: status
      required: true
      type: string
    - choices:
        - low
        - medium
        - high
      description: Priority (low, medium, high)
      name: priority
      type: string
    - description: Assigned to
      name: assignee
      type: string
    - description: Start date
      name: startdate
      type: date
    - description: Due date
      name: duedate
      type: date
    - description: All day
      name: allday
      type: boolean
  schema: crm.task.create
  schemaVersion:
    family: 1
    version: schema.sha256.bed1c0d31017d2023726bdfbb2c8686d1c50ff41a683ef625d278155b57350ff
  target: crm.task
  title: Create task
roles:
  - builder
  - user
schema: crm.task.create
target: crm.task
