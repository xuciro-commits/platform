access:
  - create: true
    edit: true
    read: team
    role: salesrep
  - archive: true
    create: true
    edit: true
    read: all
    role: salesmanager
actionTypes:
  - ref:
      app: build
      kind: action
      name: crm.lead.convert
    sourceVersion: "1"
actions:
  - description: Create or link the organization, create the contact and the deal from this lead, and mark the lead converted.
    from:
      - open
    inputs:
      - help: Leave empty to create a new organization from the lead.
        name: organization
        ref: crm.organization
        title: Link to organization
        type: reference
    name: convert
    open: deal
    title: Convert to deal
    transaction:
      guard:
        args:
          - args:
              - args:
                  - kind: boolean
                    op: ""
                    ref: converted
                  - kind: boolean
                    lit:
                      value: false
                    op: ""
                kind: boolean
                op: coalesce
              - kind: boolean
                lit:
                  value: true
                op: ""
            kind: boolean
            op: '!='
          - args:
              - kind: reference
                op: ""
                ref: status
              - kind: reference
                lit:
                  value: unqualified
                op: ""
            kind: boolean
            op: '!='
          - args:
              - kind: reference
                op: ""
                ref: status
              - kind: reference
                lit:
                  value: junk
                op: ""
            kind: boolean
            op: '!='
          - args:
              - kind: reference
                op: ""
                ref: status
              - kind: reference
                lit:
                  value: converted
                op: ""
            kind: boolean
            op: '!='
        kind: boolean
        op: and
      message: Only an open lead that is not yet converted, unqualified or junk can become a deal.
      steps:
        - changes:
            - expr:
                args:
                  - kind: text
                    op: ""
                    ref: organizationname
                  - kind: text
                    op: ""
                    ref: fullname
                kind: text
                op: coalesce
              field: name
            - expr:
                kind: text
                op: ""
                ref: website
              field: website
            - expr:
                kind: reference
                op: ""
                ref: industry
              field: industry
            - expr:
                kind: reference
                op: ""
                ref: territory
              field: territory
            - expr:
                kind: choice
                op: ""
                ref: employees
              field: employees
          kind: create
          name: organization
          target:
            type: crm.organization
          when:
            args:
              - kind: reference
                op: ""
                ref: input.organization
            kind: boolean
            op: empty
        - changes:
            - expr:
                kind: text
                op: ""
                ref: fullname
              field: fullname
            - expr:
                kind: text
                op: ""
                ref: email
              field: email
            - expr:
                kind: text
                op: ""
                ref: mobile
              field: mobile
            - expr:
                kind: text
                op: ""
                ref: phone
              field: phone
            - expr:
                kind: text
                op: ""
                ref: jobtitle
              field: designation
            - expr:
                args:
                  - kind: reference
                    op: ""
                    ref: input.organization
                  - kind: reference
                    op: ""
                    ref: step.organization
                kind: reference
                op: coalesce
              field: organization
          kind: create
          name: contact
          target:
            type: crm.contact
        - changes:
            - expr:
                args:
                  - kind: text
                    op: ""
                    ref: organizationname
                  - kind: text
                    op: ""
                    ref: fullname
                kind: text
                op: coalesce
              field: title
            - expr:
                args:
                  - kind: reference
                    op: ""
                    ref: input.organization
                  - kind: reference
                    op: ""
                    ref: step.organization
                kind: reference
                op: coalesce
              field: organization
            - expr:
                kind: reference
                op: ""
                ref: step.contact
              field: contact
            - field: lead
              from: $subject
            - expr:
                kind: reference
                op: ""
                ref: source
              field: source
            - expr:
                kind: reference
                op: ""
                ref: industry
              field: industry
            - expr:
                kind: reference
                op: ""
                ref: territory
              field: territory
            - expr:
                kind: reference
                lit:
                  value: qualification
                op: ""
              field: status
            - expr:
                kind: integer
                lit:
                  value: 10
                op: ""
              field: probability
            - expr:
                kind: text
                op: ""
                ref: owner
              field: owner
          kind: create
          name: deal
          target:
            type: crm.deal
        - changes:
            - field: state
              expr:
                op: ""
                kind: choice
                lit:
                  value: converted
            - field: converted
              expr:
                op: ""
                kind: boolean
                lit:
                  value: true
            - field: status
              expr:
                op: ""
                kind: reference
                lit:
                  value: converted
            - field: deal
              expr:
                op: ""
                kind: reference
                ref: step.deal
          kind: update
          name: lead
          target:
            id: $subject
            type: crm.lead
      subject: crm.lead
  - name: disqualify
    title: Mark unqualified
    description: Close this lead as unqualified.
    from:
      - open
    inputs:
      - name: lostreason
        title: Lost reason
        type: reference
        ref: crm.lostreason
        required: true
      - name: lostnotes
        title: Lost notes
        type: longtext
    transaction:
      subject: crm.lead
      steps:
        - name: lead
          kind: update
          target:
            type: crm.lead
            id: $subject
          changes:
            - field: state
              expr:
                op: ""
                kind: choice
                lit:
                  value: unqualified
            - field: status
              expr:
                op: ""
                kind: reference
                lit:
                  value: unqualified
            - field: lostreason
              expr:
                op: ""
                kind: reference
                ref: input.lostreason
            - field: lostnotes
              expr:
                op: ""
                kind: text
                ref: input.lostnotes
  - name: markjunk
    title: Mark junk
    description: Close this lead as junk.
    from:
      - open
    inputs:
      - name: lostnotes
        title: Lost notes
        type: longtext
    transaction:
      subject: crm.lead
      steps:
        - name: lead
          kind: update
          target:
            type: crm.lead
            id: $subject
          changes:
            - field: state
              expr:
                op: ""
                kind: choice
                lit:
                  value: junk
            - field: status
              expr:
                op: ""
                kind: reference
                lit:
                  value: junk
            - field: lostnotes
              expr:
                op: ""
                kind: text
                ref: input.lostnotes
  - name: reopen
    title: Reopen
    description: Reopen a closed lead.
    from:
      - unqualified
      - junk
    transaction:
      subject: crm.lead
      steps:
        - name: lead
          kind: update
          target:
            type: crm.lead
            id: $subject
          changes:
            - field: state
              expr:
                op: ""
                kind: choice
                lit:
                  value: open
            - field: status
              expr:
                op: ""
                kind: reference
                lit:
                  value: new
display: fullname
fields:
  - group: Contact
    name: fullname
    required: true
    search: true
    title: Full name
    type: text
  - group: Contact
    name: organizationname
    search: true
    title: Organization
    type: text
  - group: Contact
    name: email
    search: true
    title: Email
    type: text
  - group: Contact
    name: mobile
    title: Mobile no.
    type: text
  - group: Contact
    name: phone
    title: Phone
    type: text
  - group: Contact
    name: website
    title: Website
    type: text
  - group: Contact
    name: linkedin
    title: LinkedIn
    type: text
  - group: Contact
    name: jobtitle
    title: Job title
    type: text
  - group: Classification
    name: source
    ref: crm.source
    title: Source
    type: reference
  - group: Classification
    name: industry
    ref: crm.industry
    title: Industry
    type: reference
  - group: Classification
    name: territory
    ref: crm.territory
    title: Territory
    type: reference
  - choices: 1-10,11-50,51-200,201-500,501-1000,1000+
    group: Classification
    name: employees
    title: Employees
    type: choice
  - group: Classification
    name: annualrevenue
    title: Annual revenue
    type: money
  - group: Closure
    name: converted
    readOnly: true
    title: Converted
    type: boolean
  - group: Closure
    name: deal
    readOnly: true
    ref: crm.deal
    title: Deal
    type: reference
  - group: Closure
    name: lostreason
    ref: crm.lostreason
    title: Lost reason
    type: reference
    when: status=unqualified,junk
  - group: Closure
    name: lostnotes
    title: Lost notes
    type: longtext
    when: status=unqualified,junk
  - aside: true
    name: status
    ref: crm.leadstatus
    required: true
    title: Status
    type: reference
  - aside: true
    name: owner
    title: Lead owner
    type: member
    default: member
  - aside: true
    name: responseby
    title: Respond by
    type: datetime
    default: now+4h
  - aside: true
    name: slastatus
    title: First response
    type: choice
    choices: due:Due,fulfilled:Fulfilled,failed:Failed
    default: due
name: lead
namespace: crm
plural: Leads
scope:
  owner: owner
states:
  - name: open
    title: Open
    tone: info
    description: Active lead record.
  - name: converted
    title: Converted
    tone: success
    description: Lead converted to a deal.
  - name: unqualified
    title: Unqualified
    tone: danger
    description: Lead marked unqualified.
  - name: junk
    title: Junk
    tone: warning
    description: Lead marked as junk.
title: Lead
type: crm.lead
view:
  columns:
    - fullname
    - organizationname
    - status
    - email
    - mobile
    - slastatus
    - owner
  filters: []
  group: none
  lanes: status
  layout: table
  search: ""
  sort: []
  version: 1
naming: CRM-LEAD-{year}-{n:5}
constraints:
  - name: open_status
    kind: expression
    fields:
      - status
    expr:
      op: or
      kind: boolean
      args:
        - op: and
          kind: boolean
          args:
            - op: '!='
              kind: boolean
              args:
                - op: ""
                  kind: choice
                  ref: state
                - op: ""
                  kind: choice
                  lit:
                    value: ""
            - op: '!='
              kind: boolean
              args:
                - op: ""
                  kind: choice
                  ref: state
                - op: ""
                  kind: choice
                  lit:
                    value: open
        - op: and
          kind: boolean
          args:
            - op: '!='
              kind: boolean
              args:
                - op: ""
                  kind: reference
                  ref: status
                - op: ""
                  kind: reference
                  lit:
                    value: converted
            - op: '!='
              kind: boolean
              args:
                - op: ""
                  kind: reference
                  ref: status
                - op: ""
                  kind: reference
                  lit:
                    value: unqualified
            - op: '!='
              kind: boolean
              args:
                - op: ""
                  kind: reference
                  ref: status
                - op: ""
                  kind: reference
                  lit:
                    value: junk
    message: Closing a lead requires a lifecycle action.
  - name: closed_status
    kind: expression
    fields:
      - status
    expr:
      op: or
      kind: boolean
      args:
        - op: =
          kind: boolean
          args:
            - op: ""
              kind: choice
              ref: state
            - op: ""
              kind: choice
              lit:
                value: ""
        - op: =
          kind: boolean
          args:
            - op: ""
              kind: choice
              ref: state
            - op: ""
              kind: choice
              lit:
                value: open
        - op: and
          kind: boolean
          args:
            - op: =
              kind: boolean
              args:
                - op: ""
                  kind: choice
                  ref: state
                - op: ""
                  kind: choice
                  lit:
                    value: converted
            - op: =
              kind: boolean
              args:
                - op: ""
                  kind: reference
                  ref: status
                - op: ""
                  kind: reference
                  lit:
                    value: converted
        - op: and
          kind: boolean
          args:
            - op: =
              kind: boolean
              args:
                - op: ""
                  kind: choice
                  ref: state
                - op: ""
                  kind: choice
                  lit:
                    value: unqualified
            - op: =
              kind: boolean
              args:
                - op: ""
                  kind: reference
                  ref: status
                - op: ""
                  kind: reference
                  lit:
                    value: unqualified
        - op: and
          kind: boolean
          args:
            - op: =
              kind: boolean
              args:
                - op: ""
                  kind: choice
                  ref: state
                - op: ""
                  kind: choice
                  lit:
                    value: junk
            - op: =
              kind: boolean
              args:
                - op: ""
                  kind: reference
                  ref: status
                - op: ""
                  kind: reference
                  lit:
                    value: junk
    message: A closed lead's status cannot be edited directly; reopen it first.
