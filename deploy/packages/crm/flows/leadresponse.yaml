name: build.leadresponse
subject:
  app: build
  kind: object
  name: crm.lead
actions:
  - app: build
    kind: action
    name: crm.lead.edit
definition:
  name: leadresponse
  title: Watch the first response deadline
  kind: flow
  object: crm.lead
  when: open
  steps:
    - name: deadline
      kind: wait
      waitUntil:
        source: subject
        path:
          - responseby
      next: pending
    - name: pending
      kind: switch
      value:
        source: subject
        path:
          - slastatus
      cases:
        due: overdue
      next: done
    - name: overdue
      kind: action
      inputs:
        slastatus:
          source: literal
          value: failed
      next: tell
      act: edit
    - name: tell
      notify:
        title: First response overdue
        body: This lead passed its first response deadline while still new.
        field: owner
      kind: notify
      next: done
    - name: done
      kind: end
