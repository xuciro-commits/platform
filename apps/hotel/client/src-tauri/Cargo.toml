[package]
name = "hotel-desk"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Serve the built web app (web/apps/hotel-desk/dist) instead of the Vite dev server.
custom-protocol = ["tauri/custom-protocol"]
