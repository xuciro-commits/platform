// K2 Fact kinds and K3 Provenance — data contract only. Meaning: Contract/spec/K2-K3-facts.md.
syntax = "proto3";

package platform.kernel.v1alpha1;

import "google/protobuf/timestamp.proto";
import "platform/kernel/v1alpha1/change.proto";
import "platform/kernel/v1alpha1/identity.proto";

// Decisions are not facts of this message: they are K4 change records.
enum FactKind {
  FACT_KIND_UNSPECIFIED = 0;
  FACT_KIND_OBSERVATION = 1;
  FACT_KIND_CLAIM = 2;
  FACT_KIND_DERIVED = 3;
}

// Who or what produced a fact, and on what basis.
message Provenance {
  oneof source {
    string principal_id = 1;
    string connector_id = 2;
  }
  // When the source produced the fact, by the source's clock.
  google.protobuf.Timestamp source_time = 3;
  // Claims only: the source's confidence in (0, 1].
  double confidence = 4;
}

message Fact {
  string tenant_id = 1;
  FactKind kind = 2;
  EntityRef subject = 3;
  // The aspect of the subject the fact is about; claims coexist per (subject, attribute).
  string attribute = 4;
  SchemaRef schema = 5;
  Provenance provenance = 6;
  // Derived only: the recorded facts it was computed from.
  repeated string derived_from = 7;
  string idempotency_key = 8;
  bytes payload = 9;
}

// An accepted fact. Immutable once recorded.
message FactRecord {
  string fact_id = 1;
  Fact fact = 2;
  google.protobuf.Timestamp recorded_time = 3;
}
