name: Download Go module dependencies
on:
  workflow_dispatch:
  push:
    branches: [arena/021430d4-platform]
jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          check-latest: true
      - name: Download Go module dependencies
        working-directory: capabilities/server
        run: go mod download
      - name: Upload Go module cache
        uses: actions/upload-artifact@v4
        with:
          name: go-mod-cache
          path: |
            ~/go/pkg/mod
          retention-days: 7
